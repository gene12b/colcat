[package]
name = "colcat"
version = "0.2.0"
edition = "2024"
description = "Text colorization tool for reading"
license = "MIT"
readme = "README.adoc"
repository = "https://github.com/gene12b/colcat"


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
csscolorparser = { version = "0.9.0", features = ["serde"] }
palette = { version = "0.7.7", features = ["serde"] }
ratatui = { version = "0.30.2", features = ["palette"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.22.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["serde"] }
tachyonfx = { version = "0.25.1", optional = true}
itertools = "0.15.0"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
candle = {version = "0.1.0", optional = true}
candle-transformers = {version = "0.11.0", optional = true}
tokenizers = {version = "0.23.2", optional = true}
candle-nn = {version = "0.11.0", optional = true}
oxidize-pdf = {version = "5.1.0", optional = true}
strum = { version = "0.28.0", features = ["derive"] }
vecstat = { version = "0.2.0", features = ["partial"] }
schemars = "1.2.2"
docx-rust = {version = "0.1.11", optional = true}
jetscii = { version = "0.5.3", optional = true}
tokio = { version = "1.53.3", features = ["full"] }
ratatui-notifications = "0.1.0"

[dev-dependencies]
candle = "0.1.0"

[features]
animate = ["dep:tachyonfx"]
semantics = ["dep:candle", "dep:candle-transformers", "dep:tokenizers", "dep:candle-nn"]
eyetracker = []
pdf = ["dep:oxidize-pdf"]
html = []
docx = ["dep:docx-rust", "dep:jetscii"]
webapp = []

[[example]]
name = "ser"
path = "./examples/ser.rs"

# [[example]]
# name = "semantics"
# path = "./examples/semantics.rs"

[[example]]
name = "load_docx"
path = "./examples/load_docx.rs"
